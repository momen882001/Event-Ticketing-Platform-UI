<aside class="sidebar">
  <button class="toggle-btn" (click)="toggleSidebar()">
    <i class="bi bi-list"></i>
  </button>

  <div class="brand">
    <div class="logo">
      <i class="bi-ticket-perforated-fill"></i>
    </div>

    <div class="brand-info">
      <h2>Event Ticketing</h2>

      <div class="user-info">
        <span class="username">
          {{ getFullname() }}
        </span>

        <span class="role-badge" [ngClass]="getUserRole()?.toLowerCase()">
          {{ getDashboardTitleDependsRole() }}
        </span>
      </div>
    </div>
  </div>

  <nav class="navigation">
    <!-- Only for admin -->
    @if (isAdmin()) {
      <a routerLink="/dashboard/users" routerLinkActive="active" class="nav-item">
        <i class="bi bi-people"></i>
        <span>Users</span>
      </a>
      <a routerLink="/dashboard/categories" routerLinkActive="active" class="nav-item">
        <i class="bi bi-grid"></i>
        <span>Categories</span>
      </a>
      <a routerLink="/dashboard/venues" routerLinkActive="active" class="nav-item">
        <i class="bi bi-buildings"></i>
        <span>Venues</span>
      </a>
    }
    <!-- For All Roles -->
    <a routerLink="/dashboard/calendar" routerLinkActive="active" class="nav-item">
      <i class="bi bi-calendar"></i>
      <span>Events</span>
    </a>
    <!-- Only for users -->
    @if (isUser()) {
      <a routerLink="/dashboard/bookings" routerLinkActive="active" class="nav-item">
        <i class="bi bi-ticket-perforated-fill"></i>
        <span>My Bookings</span>
      </a>
    }

    <!-- For Admin and Organizers -->
    @if (isAdmin() || isOrganizer()) {
      <a routerLink="/dashboard/bookings/tickets/scan" routerLinkActive="active" class="nav-item">
        <i class="bi bi-qr-code-scan"></i>
        <span>Scan Tickets</span>
      </a>
    }
  </nav>

  <div class="bottom-section">
    <a routerLink="/dashboard/user-profile" routerLinkActive="active" class="nav-item profile-btn">
      <i class="bi bi-person-circle"></i>
      <span>Profile</span>
    </a>

    <button class="logout-btn" (click)="logout()">
      <i class="bi bi-box-arrow-right"></i>
      <span>Logout</span>
    </button>
  </div>
</aside>
