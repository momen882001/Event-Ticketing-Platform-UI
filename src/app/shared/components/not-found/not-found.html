<main class="error-page">
  <div class="background-glow background-glow-primary"></div>
  <div class="background-glow background-glow-secondary"></div>

  <section class="error-card">
    <!-- Ticket illustration -->
    <div class="ticket-scene">
      <div class="ticket ticket-back">
        <div class="ticket-content">
          <mat-icon>confirmation_number</mat-icon>
        </div>
      </div>

      <div class="ticket ticket-main">
        <div class="ticket-left">
          <mat-icon>confirmation_number</mat-icon>
        </div>

        <div class="ticket-divider">
          <span></span>
          <span></span>
          <span></span>
          <span></span>
          <span></span>
        </div>

        <div class="ticket-right">
          <strong>404</strong>
          <small>NOT FOUND</small>
        </div>
      </div>

      <div class="floating-icon search-icon">
        <mat-icon>search</mat-icon>
      </div>

      <span class="dot dot-one"></span>
      <span class="dot dot-two"></span>
      <span class="dot dot-three"></span>
    </div>

    <!-- Content -->
    <div class="content">
      <span class="eyebrow"> PAGE NOT FOUND </span>

      <h1>Looks like this ticket is missing</h1>

      <p>
        The page you're looking for doesn't exist, may have been moved, or the link might be
        incorrect.
      </p>

      <div class="actions">
        <button type="button" class="primary-button" (click)="goToDashboard()">
          <mat-icon>dashboard</mat-icon>
          <span>Go to Dashboard</span>
        </button>

        <button type="button" class="secondary-button" (click)="goBack()">
          <mat-icon>arrow_back</mat-icon>
          <span>Go Back</span>
        </button>
      </div>
    </div>

    <!-- Status -->
    <div class="status-code">404</div>
  </section>
</main>
