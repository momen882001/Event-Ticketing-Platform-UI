<article class="event-card">
  <div class="event-card__media">
    <img [src]="imageUrl" [alt]="event.title" loading="lazy" />
    <span class="event-card__badge">{{ categoryName }}</span>
    @if (event.status === EventStatusEnum.PUBLISHED) {
      <span class="event-card__status-dot" title="Available"></span>
    }
  </div>

  <div class="event-card__body">
    <h3 class="event-card__title">{{ event.title }}</h3>

    <div class="event-card__meta">
      <span class="event-card__meta-item">
        <svg class="event-card__icon" viewBox="0 0 16 16" fill="none" aria-hidden="true">
          <rect x="1" y="2" width="14" height="13" rx="2" stroke="currentColor" stroke-width="1.4"/>
          <path d="M1 6h14" stroke="currentColor" stroke-width="1.4"/>
          <path d="M5 1v2M11 1v2" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
        </svg>
        {{ formattedDate }} · {{ formattedTime }}
      </span>
      <span class="event-card__meta-item">
        <svg class="event-card__icon" viewBox="0 0 16 16" fill="none" aria-hidden="true">
          <path d="M8 1.5C5.515 1.5 3.5 3.515 3.5 6c0 3.5 4.5 8.5 4.5 8.5S12.5 9.5 12.5 6c0-2.485-2.015-4.5-4.5-4.5Z" stroke="currentColor" stroke-width="1.4"/>
          <circle cx="8" cy="6" r="1.5" stroke="currentColor" stroke-width="1.4"/>
        </svg>
        {{ venueName }}
      </span>
    </div>

    <div class="event-card__footer">
      <strong class="event-card__price">{{ lowestPrice }}</strong>
      @if (event.status === EventStatusEnum.PUBLISHED) {
        <button type="button" class="event-card__btn" (click)="book.emit(event)">
          Book now
        </button>
      } @else {
        <span class="event-card__unavailable">{{ event.status }}</span>
      }
    </div>
  </div>
</article>
